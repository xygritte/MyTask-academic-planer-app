name: Patch immediate logout

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply logout state fix
        run: python3 .github/patch_logout.py

      - name: Commit fix and remove patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-immediate-logout.yml .github/patch_logout.py
          git add app/src/main/java/com/mytask/MainActivity.kt .github/workflows/patch-immediate-logout.yml .github/patch_logout.py
          git commit -m "Fix immediate return to login after logout"
          git push
