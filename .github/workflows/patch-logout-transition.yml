name: Patch logout transition

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix logout transition after successful sign out'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch MainActivity logout callback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/mytask/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          old1 = '''                                }.onSuccess {
                                    onlineSaveMessage = "Data berhasil disimpan. Keluar dari akun..."
                                    authRepository.clearLocalSession()
                                }.onFailure { error ->'''

          new1 = '''                                }.onSuccess {
                                    onlineSaveMessage = "Data berhasil disimpan. Keluar dari akun..."
                                    authRepository.clearLocalSession()
                                    onLoggedOut()
                                }.onFailure { error ->'''

          old2 = '''                            } else {
                                authRepository.clearLocalSession()
                            }
'''

          new2 = '''                            } else {
                                authRepository.clearLocalSession()
                                onLoggedOut()
                            }
'''

          changed = False
          if old1 in text:
              text = text.replace(old1, new1, 1)
              changed = True
          if old2 in text:
              text = text.replace(old2, new2, 1)
              changed = True

          if not changed:
              raise SystemExit('Expected logout success block not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove patch workflow and commit
        shell: bash
        run: |
          rm .github/workflows/patch-logout-transition.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/mytask/MainActivity.kt .github/workflows/patch-logout-transition.yml
          git commit -m "Fix logout transition after successful sign out"
          git push
