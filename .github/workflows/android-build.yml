name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch logout state transition
        if: github.event_name == 'push' && github.event.head_commit.message != 'Fix logout transition after successful sign out'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/mytask/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          old1 = '''                                }.onSuccess {
                                    onlineSaveMessage = "Data berhasil disimpan. Keluar dari akun..."
                                    authRepository.clearLocalSession()
                                }.onFailure { error ->'''
          new1 = '''                                }.onSuccess {
                                    onlineSaveMessage = "Data berhasil disimpan. Keluar dari akun..."
                                    authRepository.clearLocalSession()
                                    onLoggedOut()
                                }.onFailure { error ->'''

          old2 = '''                            } else {
                                authRepository.clearLocalSession()
                            }
'''
          new2 = '''                            } else {
                                authRepository.clearLocalSession()
                                onLoggedOut()
                            }
'''

          changed = False
          if old1 in text:
              text = text.replace(old1, new1, 1)
              changed = True
          if old2 in text:
              text = text.replace(old2, new2, 1)
              changed = True

          if changed:
              path.write_text(text, encoding='utf-8')
          else:
              print('Logout transition already patched; continuing without a commit.')
          PY

          if git diff --quiet -- app/src/main/java/com/mytask/MainActivity.kt; then
            echo "No logout patch changes needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/mytask/MainActivity.kt
            git commit -m "Fix logout transition after successful sign out"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTask-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTask-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
