name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch logout state transition
        if: github.event_name == 'push' && github.event.head_commit.message != 'Fix logout transition after successful sign out'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/mytask/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          old1 = '''                                }.onSuccess {
                                    onlineSaveMessage = "Data berhasil disimpan. Keluar dari akun..."
                                    authRepository.clearLocalSession()
                                }.onFailure { error ->'''
          new1 = '''                                }.onSuccess {
                                    onlineSaveMessage = "Data berhasil disimpan. Keluar dari akun..."
                                    authRepository.clearLocalSession()
                                    onLoggedOut()
                                }.onFailure { error ->'''

          old2 = '''                            } else {
                                authRepository.clearLocalSession()
                            }
'''
          new2 = '''                            } else {
                                authRepository.clearLocalSession()
                                onLoggedOut()
                            }
'''

          changed = False
          if old1 in text:
              text = text.replace(old1, new1, 1)
              changed = True
          if old2 in text:
              text = text.replace(old2, new2, 1)
              changed = True

          if changed:
              path.write_text(text, encoding='utf-8')
          else:
              print('Logout transition already patched; continuing without a commit.')
          PY

          if git diff --quiet -- app/src/main/java/com/mytask/MainActivity.kt; then
            echo "No logout patch changes needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/mytask/MainActivity.kt
            git commit -m "Fix logout transition after successful sign out"
            git fetch origin main
            git rebase origin/main
            git push
          fi

      - name: Patch schedule time picker callback
        if: github.event_name == 'push' && github.event.head_commit.message != 'fix(ui): make schedule time picker callback non-composable'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/mytask/ui/schedule/ScheduleScreen.kt')
          text = path.read_text(encoding='utf-8')

          old_block = '''    Row(
        modifier = Modifier.fillMaxWidth(),
        verticalAlignment = Alignment.CenterVertically
    ) {
        TimeField(
            label = "Mulai ${index + 1}",
            value = range.startMinutes.toDisplayTime(),
            modifier = Modifier.weight(1f)
        ) {
            val context = LocalContext.current
            TimePickerDialog(
                context,
                { _, hour, minute -> onStartChanged(hour * 60 + minute) },
                range.startMinutes / 60,
                range.startMinutes % 60,
                true
            ).show()
        }

        Spacer(Modifier.width(8.dp))
        Text("→", style = MaterialTheme.typography.titleLarge)
        Spacer(Modifier.width(8.dp))

        TimeField(
            label = "Selesai ${index + 1}",
            value = range.endMinutes.toDisplayTime(),
            modifier = Modifier.weight(1f)
        ) {
            val context = LocalContext.current
            TimePickerDialog(
                context,
                { _, hour, minute -> onEndChanged(hour * 60 + minute) },
                range.endMinutes / 60,
                range.endMinutes % 60,
                true
            ).show()
        }
'''
          new_block = '''    val context = LocalContext.current

    Row(
        modifier = Modifier.fillMaxWidth(),
        verticalAlignment = Alignment.CenterVertically
    ) {
        TimeField(
            label = "Mulai ${index + 1}",
            value = range.startMinutes.toDisplayTime(),
            modifier = Modifier.weight(1f)
        ) {
            TimePickerDialog(
                context,
                { _, hour, minute -> onStartChanged(hour * 60 + minute) },
                range.startMinutes / 60,
                range.startMinutes % 60,
                true
            ).show()
        }

        Spacer(Modifier.width(8.dp))
        Text("→", style = MaterialTheme.typography.titleLarge)
        Spacer(Modifier.width(8.dp))

        TimeField(
            label = "Selesai ${index + 1}",
            value = range.endMinutes.toDisplayTime(),
            modifier = Modifier.weight(1f)
        ) {
            TimePickerDialog(
                context,
                { _, hour, minute -> onEndChanged(hour * 60 + minute) },
                range.endMinutes / 60,
                range.endMinutes % 60,
                true
            ).show()
        }
'''

          old_signature = '''private fun TimeField(
    label: String,
    value: String,
    modifier: Modifier,
    onClick: @Composable () -> Unit
)'''
          new_signature = '''private fun TimeField(
    label: String,
    value: String,
    modifier: Modifier,
    onClick: () -> Unit
)'''

          old_surface = '        onClick = onClick as () -> Unit\n'
          new_surface = '        onClick = onClick\n'

          changed = False
          if old_block in text:
              text = text.replace(old_block, new_block, 1)
              changed = True
          if old_signature in text:
              text = text.replace(old_signature, new_signature, 1)
              changed = True
          if old_surface in text:
              text = text.replace(old_surface, new_surface, 1)
              changed = True

          if not changed:
              print('Schedule time picker callback already patched; continuing without a commit.')
          else:
              path.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet -- app/src/main/java/com/mytask/ui/schedule/ScheduleScreen.kt; then
            echo "No schedule callback patch changes needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/mytask/ui/schedule/ScheduleScreen.kt
            git commit -m "fix(ui): make schedule time picker callback non-composable"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || exit 1
              if git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Failed to push schedule callback patch after 5 attempts."
                exit 1
              fi
              sleep 2
            done
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTask-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTask-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
